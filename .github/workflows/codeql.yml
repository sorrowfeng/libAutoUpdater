name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "24 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          languages: c-cpp

      - name: Configure
        run: >
          cmake -S . -B build
          -DLIBAUTOUPDATER_BUILD_EXAMPLES=ON
          -DLIBAUTOUPDATER_BUILD_TESTS=ON
          -DLIBAUTOUPDATER_BUILD_UPDATER=ON
          -DLIBAUTOUPDATER_WITH_QT=OFF
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
