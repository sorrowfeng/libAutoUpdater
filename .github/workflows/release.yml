name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  verify-release-source:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Tag Commit
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$GITHUB_SHA" ] || [ "$head_commit" != "$GITHUB_SHA" ]; then
            echo "Release tag, checked-out commit, and workflow SHA must match exactly." >&2
            exit 1
          fi

      - name: Verify Main Ancestry
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Validate Release Metadata
        run: python tools/check_release_ready.py --tag "$GITHUB_REF_NAME"

      - name: Require Successful Main CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          successful_runs="$(gh api --method GET \
            "repos/${GH_REPO}/actions/workflows/ci.yml/runs" \
            -f event=push \
            -f branch=main \
            -f head_sha="$GITHUB_SHA" \
            -f status=completed \
            -f per_page=100 \
            --jq "[.workflow_runs[] | select(
              .head_sha == \"${GITHUB_SHA}\" and
              .event == \"push\" and
              .head_branch == \"main\" and
              .status == \"completed\" and
              .conclusion == \"success\"
            )] | length")"
          if [ "$successful_runs" -lt 1 ]; then
            echo "No successful ci.yml main push run exists for ${GITHUB_SHA}." >&2
            exit 1
          fi

  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [verify-release-source]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build
          -DLIBAUTOUPDATER_BUILD_EXAMPLES=OFF
          -DLIBAUTOUPDATER_BUILD_TESTS=ON
          -DLIBAUTOUPDATER_BUILD_UPDATER=ON
          -DLIBAUTOUPDATER_WITH_QT=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix install-package

      - name: Generate SBOM
        shell: bash
        run: |
          mkdir -p artifacts
          version="${GITHUB_REF_NAME#v}"
          python tools/make_sbom.py install-package \
            --version "$version" \
            --dependencies build/libAutoUpdater-sbom-dependencies.json \
            --platform "${RUNNER_OS}-${RUNNER_ARCH}" \
            --commit "$GITHUB_SHA" \
            --generation-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "artifacts/libAutoUpdater-${GITHUB_REF_NAME}-${RUNNER_OS}.spdx.json"

      - name: Archive
        shell: bash
        run: |
          mkdir -p artifacts
          archive="artifacts/libAutoUpdater-${GITHUB_REF_NAME}-${RUNNER_OS}.zip"
          cmake -E tar cfv "$archive" --format=zip install-package

      - name: Upload Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ runner.os }}
          path: artifacts/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [package]
    environment: release
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Release Metadata
        run: python tools/check_release_ready.py --tag "$GITHUB_REF_NAME"

      - name: Generate Release Notes
        run: python tools/extract_changelog.py "$GITHUB_REF_NAME" --output release-notes.md

      - name: Download Artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: release-artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -t files < <(find release-artifacts -type f | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
