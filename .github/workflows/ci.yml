name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Whitespace Check
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD -- .
          else
            git diff --check -- .
          fi

      - name: Validate Python Tools
        run: >
          python -m py_compile
          tools/make_manifest.py
          tools/make_index.py
          tools/metadata_contract.py
          tools/sign_manifest.py
          tools/gc_objects.py
          tools/check_release_ready.py
          tools/extract_changelog.py
          tools/make_sbom.py
          tools/evidence_contract.py
          tools/check_privilege_boundary.py
          tools/check_feed_retention.py
          tools/inspect_state_security.py
          tools/check_external_json_parser.py
          tools/dependency_review.py
          examples/github_update_demo.py
          tests/e2e_flow.py
          tests/gc_objects_tests.py
          tests/metadata_tool_tests.py
          tests/sbom_tool_tests.py
          tests/deployment_investigation_tests.py
          tests/state_security_tool_tests.py
          tests/json_parser_consistency_tests.py
          tests/dependency_review_tool_tests.py
          tests/installed_update_rollback.py
          tests/signed_release_artifact_test.py

      - name: Validate CMake Presets
        run: cmake --list-presets

      - name: Validate Packaging Tools
        run: |
          mkdir -p packaging-probe/release/bin
          printf 'probe' > packaging-probe/release/bin/app.txt
          python tools/make_manifest.py packaging-probe/release \
            --app-id com.example.probe \
            --platform linux \
            --arch x64 \
            --version 1.2.3 \
            --release-date 2026-06-01T10:00:00Z \
            --base-url https://example.com/releases/1.2.3/
          python tools/make_index.py \
            --app-id com.example.probe \
            --channel stable \
            --generated-at 2026-06-01T10:00:00Z \
            --target linux/x64=https://example.com/releases/1.2.3/manifest.json \
            --output packaging-probe/index.json
          python tools/make_manifest.py packaging-probe/release \
            --content-addressed \
            --object-root packaging-probe/objects/sha256 \
            --object-prefix objects/sha256 \
            --app-id com.example.probe \
            --platform linux \
            --arch x64 \
            --version 1.2.3 \
            --release-date 2026-06-01T10:00:00Z \
            --base-url https://example.com/updates/ \
            --output packaging-probe/content-addressed-manifest.json
          python tools/gc_objects.py packaging-probe/objects/sha256 \
            --manifest packaging-probe/content-addressed-manifest.json
          python tools/make_sbom.py packaging-probe/release \
            --version 1.2.3 \
            --output packaging-probe/sbom.spdx.json
          python tools/check_release_ready.py --version-only

  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check format
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.h')
          clang-format --dry-run --Werror "${files[@]}"

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy

      - name: Configure
        run: >
          cmake -S . -B tidy-build
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DLIBAUTOUPDATER_BUILD_EXAMPLES=OFF
          -DLIBAUTOUPDATER_BUILD_TESTS=ON
          -DLIBAUTOUPDATER_BUILD_UPDATER=ON
          -DLIBAUTOUPDATER_WITH_CURL=OFF
          -DLIBAUTOUPDATER_WITH_OPENSSL=OFF
          -DLIBAUTOUPDATER_WITH_QT=OFF
          -DCMAKE_BUILD_TYPE=Debug

      - name: Run clang-tidy
        run: |
          mapfile -t files < <(git ls-files \
            'src/*.cpp' \
            'src/default/BasicNetworkClient.cpp' \
            'src/default/DirectDispatcher.cpp' \
            'src/default/JsonStateStore.cpp' \
            'src/default/NullSignatureVerifier.cpp' \
            'src/default/ProcessLauncher.cpp' \
            'src/default/Sha256HashProvider.cpp' \
            'src/default/StdFileSystem.cpp' \
            'src/util/*.cpp' \
            'updater/*.cpp')
          clang-tidy -p tidy-build --warnings-as-errors='clang-analyzer-*' "${files[@]}"

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-debug
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Debug
            cmake_args: -DLIBAUTOUPDATER_WITH_QT=OFF

          - name: ubuntu-clang-debug-no-optional-deps
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
            cmake_args: -DLIBAUTOUPDATER_WITH_QT=OFF -DLIBAUTOUPDATER_WITH_CURL=OFF -DLIBAUTOUPDATER_WITH_OPENSSL=OFF -DLIBAUTOUPDATER_WARNINGS_AS_ERRORS=ON

          - name: ubuntu-gcc-release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
            cmake_args: -DLIBAUTOUPDATER_WITH_QT=OFF

          - name: macos-appleclang-debug
            os: macos-latest
            cc: ""
            cxx: ""
            build_type: Debug
            cmake_args: -DLIBAUTOUPDATER_WITH_QT=OFF

          - name: windows-msvc-debug
            os: windows-latest
            cc: ""
            cxx: ""
            build_type: Debug
            cmake_args: -DLIBAUTOUPDATER_WITH_QT=OFF

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
            export CXX="${{ matrix.cxx }}"
          fi
          cmake -S . -B build \
            -DLIBAUTOUPDATER_BUILD_EXAMPLES=ON \
            -DLIBAUTOUPDATER_BUILD_TESTS=ON \
            -DLIBAUTOUPDATER_BUILD_UPDATER=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Install Probe
        run: cmake --install build --config ${{ matrix.build_type }} --prefix install-probe

      - name: Consumer Probe Configure
        shell: bash
        run: >
          cmake -S tests/consumer -B consumer-build
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-probe"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Consumer Probe Build
        run: cmake --build consumer-build --config ${{ matrix.build_type }} --parallel

      - name: Consumer Probe Run
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./consumer-build/${{ matrix.build_type }}/libAutoUpdater_consumer_probe.exe
          else
            ./consumer-build/libAutoUpdater_consumer_probe
          fi

  library-only-config:
    name: Library-only CMake config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build
          -DLIBAUTOUPDATER_BUILD_EXAMPLES=OFF
          -DLIBAUTOUPDATER_BUILD_TESTS=OFF
          -DLIBAUTOUPDATER_BUILD_UPDATER=OFF
          -DLIBAUTOUPDATER_WITH_CURL=OFF
          -DLIBAUTOUPDATER_WITH_OPENSSL=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install Probe
        run: cmake --install build --config Release --prefix install-probe

  platform-adapter-contract:
    name: Platform adapter contract (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-curl
            os: ubuntu-latest
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y libcurl4-openssl-dev
            cmake_args: -DLIBAUTOUPDATER_WITH_CURL=ON -DLIBAUTOUPDATER_REQUIRE_CURL=ON -DLIBAUTOUPDATER_WITH_QT=OFF
            test_regex: ^libAutoUpdater_tests$

          - name: windows-winhttp
            os: windows-latest
            install_deps: ""
            cmake_args: -DLIBAUTOUPDATER_WITH_CURL=OFF -DLIBAUTOUPDATER_WITH_WINHTTP=ON -DLIBAUTOUPDATER_WITH_QT=OFF
            test_regex: ^libAutoUpdater_tests$

          - name: macos-cfnetwork
            os: macos-latest
            install_deps: ""
            cmake_args: -DLIBAUTOUPDATER_WITH_CURL=OFF -DLIBAUTOUPDATER_WITH_CFNETWORK=ON -DLIBAUTOUPDATER_WITH_QT=OFF
            test_regex: ^libAutoUpdater_tests$

          - name: ubuntu-qt
            os: ubuntu-latest
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y libcurl4-openssl-dev qt6-base-dev
            cmake_args: -DLIBAUTOUPDATER_WITH_CURL=ON -DLIBAUTOUPDATER_REQUIRE_CURL=ON -DLIBAUTOUPDATER_WITH_QT=ON
            test_regex: ^(libAutoUpdater_tests|libAutoUpdater_qt_network_contract)$

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependencies
        if: matrix.install_deps != ''
        shell: bash
        run: ${{ matrix.install_deps }}

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DLIBAUTOUPDATER_BUILD_EXAMPLES=ON \
            -DLIBAUTOUPDATER_BUILD_TESTS=ON \
            -DLIBAUTOUPDATER_BUILD_UPDATER=ON \
            -DLIBAUTOUPDATER_WITH_OPENSSL=OFF \
            ${{ matrix.cmake_args }} \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run real adapter contracts
        run: >
          ctest --test-dir build -C Debug
          -R '${{ matrix.test_regex }}'
          --output-on-failure

  required-openssl:
    name: Required OpenSSL crypto contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Reject disabled required OpenSSL
        shell: bash
        run: |
          if cmake -S . -B disabled-openssl-build \
            -DLIBAUTOUPDATER_BUILD_EXAMPLES=OFF \
            -DLIBAUTOUPDATER_BUILD_TESTS=OFF \
            -DLIBAUTOUPDATER_BUILD_UPDATER=OFF \
            -DLIBAUTOUPDATER_WITH_CURL=OFF \
            -DLIBAUTOUPDATER_WITH_OPENSSL=OFF \
            -DLIBAUTOUPDATER_REQUIRE_OPENSSL=ON; then
            echo "Configuration unexpectedly accepted disabled required OpenSSL" >&2
            exit 1
          fi

      - name: Reject unavailable OpenSSL
        shell: bash
        run: |
          if cmake -S . -B missing-openssl-build \
            -DLIBAUTOUPDATER_BUILD_EXAMPLES=OFF \
            -DLIBAUTOUPDATER_BUILD_TESTS=OFF \
            -DLIBAUTOUPDATER_BUILD_UPDATER=OFF \
            -DLIBAUTOUPDATER_WITH_CURL=OFF \
            -DLIBAUTOUPDATER_WITH_OPENSSL=ON \
            -DLIBAUTOUPDATER_REQUIRE_OPENSSL=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE; then
            echo "Configuration unexpectedly succeeded without required OpenSSL" >&2
            exit 1
          fi

      - name: Install OpenSSL development package
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev openssl

      - name: Configure required OpenSSL build
        run: >
          cmake -S . -B build
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DLIBAUTOUPDATER_BUILD_EXAMPLES=OFF
          -DLIBAUTOUPDATER_BUILD_TESTS=ON
          -DLIBAUTOUPDATER_BUILD_UPDATER=ON
          -DLIBAUTOUPDATER_WITH_CURL=OFF
          -DLIBAUTOUPDATER_WITH_OPENSSL=ON
          -DLIBAUTOUPDATER_REQUIRE_OPENSSL=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Verify and test real OpenSSL implementation
        shell: bash
        run: |
          grep -F 'LIBAUTOUPDATER_TEST_HAS_OPENSSL=1' build/compile_commands.json
          ctest --test-dir build -C Debug \
            -R '^(libAutoUpdater_tests|libAutoUpdater_signed_release_artifact_validation)$' \
            --output-on-failure

  shared-package-contract:
    name: Shared installed-package contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build
          -DBUILD_SHARED_LIBS=ON
          -DLIBAUTOUPDATER_BUILD_EXAMPLES=OFF
          -DLIBAUTOUPDATER_BUILD_TESTS=ON
          -DLIBAUTOUPDATER_BUILD_UPDATER=ON
          -DLIBAUTOUPDATER_WITH_CURL=OFF
          -DLIBAUTOUPDATER_WITH_OPENSSL=OFF
          -DLIBAUTOUPDATER_WITH_QT=OFF
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Validate Installed Package
        run: >
          ctest --test-dir build -C Debug
          -R '^libAutoUpdater_install_package_validation$'
          --output-on-failure

  sanitizers:
    name: ASan/UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=clang++
          -DLIBAUTOUPDATER_BUILD_EXAMPLES=ON
          -DLIBAUTOUPDATER_BUILD_TESTS=ON
          -DLIBAUTOUPDATER_BUILD_UPDATER=ON
          -DLIBAUTOUPDATER_WITH_CURL=OFF
          -DLIBAUTOUPDATER_WITH_OPENSSL=OFF
          -DLIBAUTOUPDATER_WITH_QT=OFF
          -DLIBAUTOUPDATER_ENABLE_SANITIZERS=ON
          -DLIBAUTOUPDATER_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build -C Debug --output-on-failure

  coverage-guided-fuzzing:
    name: Clang coverage-guided fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure persistent fuzz target
        run: >
          cmake -S tests/fuzz -B fuzz-build
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build fuzz-build --target libAutoUpdater_parser_fuzzer --parallel

      - name: Run bounded coverage-guided session
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          mkdir -p fuzz-artifacts
          ./fuzz-build/libAutoUpdater_parser_fuzzer \
            tests/fuzz/corpus \
            -dict=tests/fuzz/autoupdater.dict \
            -artifact_prefix=fuzz-artifacts/ \
            -max_len=1048576 \
            -timeout=10 \
            -rss_limit_mb=2048 \
            -max_total_time=60 \
            -print_final_stats=1

      - name: Preserve evolved corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-results-${{ github.sha }}
          path: |
            tests/fuzz/corpus
            fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      - name: Configure
        run: >
          cmake -S . -B coverage-build
          -DLIBAUTOUPDATER_BUILD_EXAMPLES=ON
          -DLIBAUTOUPDATER_BUILD_TESTS=ON
          -DLIBAUTOUPDATER_BUILD_UPDATER=ON
          -DLIBAUTOUPDATER_WITH_CURL=OFF
          -DLIBAUTOUPDATER_WITH_OPENSSL=OFF
          -DLIBAUTOUPDATER_WITH_QT=OFF
          -DLIBAUTOUPDATER_ENABLE_COVERAGE=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build coverage-build --config Debug --parallel

      - name: Test
        run: ctest --test-dir coverage-build -C Debug --output-on-failure

      - name: Report
        run: >
          gcovr --root .
          --filter src
          --exclude 'src/default/CfNetworkClient.cpp'
          --exclude 'src/default/WinHttpNetworkClient.cpp'
          --print-summary
          --xml-pretty
          --output coverage.xml

      - name: Upload Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml

  package-install-tree:
    name: Package install tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [build-test]
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build
          -DLIBAUTOUPDATER_BUILD_EXAMPLES=OFF
          -DLIBAUTOUPDATER_BUILD_TESTS=OFF
          -DLIBAUTOUPDATER_BUILD_UPDATER=ON
          -DLIBAUTOUPDATER_WITH_QT=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix install-package

      - name: Archive
        shell: bash
        run: |
          mkdir -p artifacts
          cmake -E tar cfv "artifacts/libAutoUpdater-${RUNNER_OS}-${GITHUB_SHA}.zip" --format=zip install-package

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libAutoUpdater-${{ runner.os }}-${{ github.sha }}
          path: artifacts/*

  github-hosted-demo:
    name: GitHub-hosted update demo (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-curl
            os: ubuntu-latest
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y libcurl4-openssl-dev
            cmake_args: -DLIBAUTOUPDATER_WITH_CURL=ON -DLIBAUTOUPDATER_REQUIRE_CURL=ON -DLIBAUTOUPDATER_WITH_WINHTTP=OFF

          - name: windows-winhttp
            os: windows-latest
            install_deps: ""
            cmake_args: -DLIBAUTOUPDATER_WITH_CURL=OFF -DLIBAUTOUPDATER_WITH_WINHTTP=ON

          - name: macos-cfnetwork
            os: macos-latest
            install_deps: ""
            cmake_args: -DLIBAUTOUPDATER_WITH_CURL=OFF -DLIBAUTOUPDATER_WITH_CFNETWORK=ON

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Dependencies
        if: matrix.install_deps != ''
        shell: bash
        run: ${{ matrix.install_deps }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DLIBAUTOUPDATER_BUILD_EXAMPLES=ON
          -DLIBAUTOUPDATER_BUILD_TESTS=OFF
          -DLIBAUTOUPDATER_BUILD_UPDATER=ON
          -DLIBAUTOUPDATER_WITH_QT=OFF
          ${{ matrix.cmake_args }}
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run Demo Against GitHub Raw
        run: python examples/github_update_demo.py --branch main --work-dir github-demo-work
